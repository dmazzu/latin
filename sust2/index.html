<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuego. Sustantivos de 1.ª y 2.ª declinación</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="lm-container">
        <!-- MENÚ PRINCIPAL -->
        <div id="lm-menu-screen">
            <h1>Latín</h1>
            <h2>Panel de práctica</h2>
            
            <div class="lm-menu-form">
                
                <div class="lm-form-group">
                    <label>Temas a practicar:</label>
                    <div class="checkbox-group" style="background: #252525; padding: 15px; border-radius: 4px; border: 1px solid #444; display: flex; flex-direction: column; gap: 10px;">
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel1" checked> Nivel 1: SVO básico (nom / acus)</label>
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel2_gen"> Nivel 2: Genitivo (posesión/relación)</label>
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel2_abl_prep"> Nivel 2: Ablativo de lugar en (in + abl)</label>
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel2_abl_inst"> Nivel 2: Ablativo instrumental</label>
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel2_dat"> Nivel 2: Dativo (objeto indirecto)</label>
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel2_equativa"> Nivel 2: Oraciones ecuativas (sum/esse)</label>
                    </div>
                </div>

                
                <div class="lm-form-group">
                    <label for="lm-select-quantity">Cantidad de ejercicios:</label>
                    <select id="lm-select-quantity">
                        <option value="5">5 ejercicios</option>
                        <option value="10" selected>10 ejercicios</option>
                        <option value="20">20 ejercicios</option>
                        <option value="all">Todos los disponibles</option>
                    </select>
                </div>
            </div>
            
            <button id="lm-btn-start" class="lm-btn-start">Comenzar práctica</button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="latin-mini-game" style="display: none;">
            <div class="lm-header">
                <h2>Panel de Práctica</h2>
                <div>
                    <span id="lm-progress" class="lm-progress">Ejercicio 1 / 10</span>
                    <button id="lm-btn-return-menu" class="lm-btn lm-btn-menu" style="margin-left: 15px;">Volver al menú</button>
                </div>
            </div>

            <div class="lm-scene-area">
                <div class="lm-image-container">
                    <img id="lm-scene-image" src="" alt="Escena del juego">
                    <span id="lm-image-placeholder" style="display: none;"></span>
                </div>
                <p id="lm-spanish-sentence" class="lm-sentence"></p>
            </div>

            <div class="lm-construction-area">
                <h3>Traducción al latín:</h3>
                <div id="lm-slots-container" class="lm-slots-container">
                    <!-- Dinámico -->
                </div>
            </div>

            <div class="lm-word-bank-area">
                <h3>Banco de palabras:</h3>
                <div id="lm-word-bank" class="lm-word-bank">
                    <!-- Dinámico -->
                </div>
            </div>

            <div class="lm-controls">
                <button id="lm-btn-check" class="lm-btn lm-btn-primary">Comprobar</button>
                <button id="lm-btn-next" class="lm-btn lm-btn-secondary" style="display: none;">Siguiente Escena</button>
            </div>
            <div id="lm-feedback" class="lm-feedback"></div>

            <!-- Modal Panel de Casos -->
            <div id="lm-case-panel-overlay" class="lm-overlay" style="display: none;">
                <div class="lm-case-panel">
                    <div class="lm-case-panel-header">
                        <h3 id="lm-lemma-title">lemma, lemmae, f.</h3>
                        <button id="lm-btn-close-panel" class="lm-btn-close">&times;</button>
                    </div>
                    <p class="lm-case-instructions">Selecciona el caso y número correspondiente a la función de la palabra en la frase:</p>
                    <div id="lm-case-grid" class="lm-case-grid">
                        <!-- Dinámico -->
                    </div>
                    <div class="lm-case-panel-footer">
                        <button id="lm-btn-remove-word" class="lm-btn lm-btn-danger">Quitar palabra</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>
