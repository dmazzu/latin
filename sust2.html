<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latín (ISP4) - Práctica de gramática</title>
    <style>
        :root {
            --lm-primary: #cdb067;
            --lm-primary-hover: #e6c87a;
            --lm-bg-dark: #121212;
            --lm-bg-container: #161616;
            --lm-border: #2d2d2d;
            --lm-text: #e0e0e0;
            --lm-text-dim: #8a8a8a;
            --lm-slot-bg: #1f1f1f;
            --lm-correct: #7fae8e;
            --lm-incorrect: #c96a6a;
            --lm-border-radius: 6px;
            --lm-font: 'Courier New', Courier, monospace;
        }

        body {
            font-family: var(--lm-font);
            background-color: var(--lm-bg-dark);
            color: var(--lm-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .lm-container {
            background-color: var(--lm-bg-container);
            width: 100%;
            max-width: 800px;
            border-radius: var(--lm-border-radius);
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            border: 1px solid var(--lm-border);
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        
        #lm-menu-screen { text-align: center; padding: 20px 0; }
        #lm-menu-screen h1 { color: var(--lm-primary); font-size: 2.5rem; margin-bottom: 5px; letter-spacing: 3px; text-transform: uppercase; }
        #lm-menu-screen h2 { color: var(--lm-text-dim); font-size: 1.2rem; margin-top: 0; margin-bottom: 40px; font-weight: normal; }
        
        .lm-menu-form {
            background: #1a1a1a; padding: 30px; border-radius: var(--lm-border-radius);
            border: 1px solid var(--lm-border); margin-bottom: 30px; text-align: left;
        }
        
        .lm-form-group { margin-bottom: 20px; }
        .lm-form-group label.group-label { display: block; margin-bottom: 8px; color: var(--lm-primary); font-weight: bold; }
        
        .lm-form-group select {
            width: 100%; padding: 12px; background: #252525; color: white;
            border: 1px solid #444; border-radius: 4px; font-family: inherit; font-size: 1rem; cursor: pointer;
        }
        .lm-form-group select:focus { outline: none; border-color: var(--lm-primary); }

        .lm-toggle-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .lm-toggle-option {
            position: relative; flex: 1; min-width: 110px; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 12px 10px; border-radius: 6px; border: 1px solid #444;
            background: #252525; color: #eee; cursor: pointer; transition: all 0.2s ease;
            user-select: none; font-size: 0.95rem;
        }
        .lm-toggle-option:hover { background: #2f2f2f; border-color: #666; }
        .lm-toggle-option input[type="checkbox"], .lm-toggle-option input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
        .lm-toggle-option.active { background: rgba(205, 176, 103, 0.15); border-color: var(--lm-primary); color: var(--lm-primary); font-weight: bold; }
        
        .lm-btn-start {
            background-color: var(--lm-primary); color: #000; font-size: 1.2rem; padding: 15px 40px;
            border: none; border-radius: 30px; cursor: pointer; font-weight: bold; font-family: inherit;
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
        }
        .lm-btn-start:hover { background-color: var(--lm-primary-hover); transform: scale(1.05); box-shadow: 0 0 15px rgba(205, 176, 103, 0.4); }

        .lm-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--lm-border); padding-bottom: 15px; margin-bottom: 25px; }
        .lm-header h2 { margin: 0; font-size: 1.5rem; color: var(--lm-primary); font-weight: normal; letter-spacing: 1px; }
        .lm-progress { font-weight: bold; color: var(--lm-text-dim); font-size: 0.9rem; }

        .lm-scene-area { text-align: center; margin-bottom: 30px; }
        .lm-image-container {
            width: 100%; height: 220px; background-color: #1a1a1a; border: 1px solid var(--lm-border);
            border-radius: var(--lm-border-radius); display: flex; align-items: center; justify-content: center;
            overflow: hidden; margin-bottom: 20px; color: var(--lm-text-dim); font-style: italic;
        }
        .lm-image-container img { width: 100%; height: 100%; object-fit: cover; background-color: #1a1a1a; }
        .lm-sentence { font-size: 1.3rem; font-weight: normal; margin: 0; color: #fff; letter-spacing: 0.5px; }
        h3 { font-size: 0.95rem; color: var(--lm-text-dim); margin-bottom: 15px; font-weight: normal; text-transform: uppercase; letter-spacing: 1px; }

        .lm-slots-container { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; min-height: 60px; align-items: center; }
        .lm-slot {
            min-width: 90px; height: 55px; background-color: var(--lm-slot-bg); border: 1px dashed #555;
            border-radius: var(--lm-border-radius); display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s; padding: 4px 15px; position: relative;
        }
        .lm-slot.filled { background-color: #222; border: 1px solid var(--lm-primary); box-shadow: 0 0 10px rgba(205, 176, 103, 0.1); }
        .lm-slot.filled:hover { border-color: var(--lm-primary-hover); transform: translateY(-2px); background-color: #2a2a2a; }
        .lm-slot-word { font-weight: bold; font-size: 1.15rem; color: #fff; }
        .lm-slot-case { font-size: 0.75rem; color: var(--lm-primary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        .lm-word-bank { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px; min-height: 50px; }
        .lm-word {
            background-color: #252525; border: 1px solid #444; color: #eee; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; font-weight: normal; font-size: 1.1rem; transition: all 0.2s ease;
            user-select: none; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .lm-word:hover { background-color: #333; border-color: #666; transform: translateY(-2px); }

        .lm-controls { display: flex; gap: 15px; margin-bottom: 20px; }
        .lm-btn { padding: 12px 24px; border: none; border-radius: 4px; font-size: 1.05rem; cursor: pointer; transition: background-color 0.2s; font-family: inherit; letter-spacing: 0.5px; text-transform: uppercase; }
        .lm-btn-primary { background-color: var(--lm-primary); color: #000; flex: 1; font-weight: bold; }
        .lm-btn-primary:hover { background-color: var(--lm-primary-hover); }
        .lm-btn-secondary { background-color: #333; color: #ddd; border: 1px solid #555; flex: 1; }
        .lm-btn-secondary:hover { background-color: #444; }
        .lm-btn-menu { background-color: transparent; color: var(--lm-text-dim); border: 1px solid var(--lm-border); padding: 6px 12px; font-size: 0.8rem; }
        .lm-btn-menu:hover { background-color: #222; color: #fff; }
        .lm-btn-danger { background-color: #2a1616; color: var(--lm-incorrect); border: 1px solid #5c2b2b; width: 100%; margin-top: 20px; }
        .lm-btn-danger:hover { background-color: #3d1c1c; }

        .lm-feedback { padding: 15px; border-radius: 4px; text-align: center; display: none; font-size: 1.1rem; letter-spacing: 0.5px; }
        .lm-feedback.show { display: block; }
        .lm-feedback.correct { background-color: rgba(127, 174, 142, 0.1); color: var(--lm-correct); border: 1px solid var(--lm-correct); }
        .lm-feedback.incorrect { background-color: rgba(201, 106, 106, 0.1); color: var(--lm-incorrect); border: 1px solid var(--lm-incorrect); }

        .lm-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .lm-case-panel { background-color: var(--lm-bg-container); padding: 30px; border-radius: var(--lm-border-radius); width: 90%; max-width: 450px; border: 1px solid var(--lm-primary); box-shadow: 0 0 30px rgba(205, 176, 103, 0.15); }
        .lm-case-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--lm-border); padding-bottom: 15px; }
        .lm-case-panel-header h3 { margin: 0; color: var(--lm-primary); font-style: italic; font-size: 1.2rem; text-transform: none; }
        .lm-btn-close { background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--lm-text-dim); line-height: 1; }
        .lm-btn-close:hover { color: #fff; }
        .lm-case-instructions { font-size: 0.95rem; color: var(--lm-text-dim); margin-bottom: 20px; line-height: 1.4; }
        
        .lm-case-grid { display: grid; grid-template-columns: 100px 1fr 1fr; gap: 10px; align-items: center; }
        .lm-case-row-label { font-weight: bold; font-size: 0.8rem; color: var(--lm-text-dim); text-transform: uppercase; letter-spacing: 0.5px; text-align: right; padding-right: 12px; }
        .lm-case-grid-header { font-weight: bold; text-align: center; padding-bottom: 10px; color: var(--lm-primary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .lm-case-btn { padding: 10px; background-color: #252525; border: 1px solid #444; color: #eee; border-radius: 4px; cursor: pointer; text-align: center; font-family: inherit; font-size: 0.85rem; transition: all 0.2s ease; }
        .lm-case-btn:hover { background-color: #333; border-color: #666; }
        .lm-case-btn.selected { background-color: rgba(205, 176, 103, 0.15); color: var(--lm-primary); border-color: var(--lm-primary); font-weight: bold; }
    </style>
</head>
<body>

    <div class="lm-container">
        <!-- MENÚ PRINCIPAL -->
        <div id="lm-menu-screen">
            <h1>Latín (ISP4)</h1>
            <h2>Panel de práctica</h2>
            
            <div class="lm-menu-form">
                
                <div class="lm-form-group">
                    <label class="group-label">Declinación a practicar:</label>
                    <div class="lm-toggle-group" id="lm-declension-switch">
                        <label class="lm-toggle-option"><input type="radio" name="declension" value="1st" checked><span>1ª declinación</span></label>
                        <label class="lm-toggle-option"><input type="radio" name="declension" value="2nd"><span>2ª declinación</span></label>
                        <label class="lm-toggle-option"><input type="radio" name="declension" value="mixed"><span>Ambas</span></label>
                    </div>
                </div>

                <div class="lm-form-group">
                    <label class="group-label">Foco gramatical:</label>
                    <div class="checkbox-group" style="background: #252525; padding: 15px; border-radius: 4px; border: 1px solid #444; display: flex; flex-direction: column; gap: 10px;">
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel1" checked> Nivel 1: SVO Básico (Nom / Acus)</label>
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel2_gen" checked> Nivel 2: Genitivo (posesión/relación)</label>
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel2_abl_prep" checked> Nivel 2: Ablativo de lugar (in + abl)</label>
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel2_abl_inst" checked> Nivel 2: Ablativo instrumental</label>
                        <label style="color: #eee; font-weight: normal; cursor: pointer;"><input type="checkbox" name="category" value="nivel2_dat" checked> Nivel 2: Dativo (objeto indirecto)</label>
                        <label style="color: #777; font-weight: normal; cursor: not-allowed; opacity: 0.6;"><input type="checkbox" name="category" value="nivel2_equativa" disabled> Nivel 2: Oraciones ecuativas (sum/esse) — en revisión, no disponible por ahora</label>
                    </div>
                </div>

                <div class="lm-form-group">
                    <label class="group-label" for="lm-select-quantity">Cantidad de ejercicios:</label>
                    <select id="lm-select-quantity">
                        <option value="5">5 ejercicios</option>
                        <option value="10" selected>10 ejercicios</option>
                        <option value="20">20 ejercicios</option>
                        <option value="all">Todos los disponibles</option>
                    </select>
                </div>
            </div>
            
            <button id="lm-btn-start" onclick="startGame()" class="lm-btn-start">Comenzar Práctica</button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="latin-mini-game" style="display: none;">
            <div class="lm-header">
                <h2>Panel de práctica</h2>
                <div>
                    <span id="lm-progress" class="lm-progress">Ejercicio 1 / 10</span>
                    <button id="lm-btn-return-menu" onclick="showMenu()" class="lm-btn lm-btn-menu" style="margin-left: 15px;">Volver al Menú</button>
                </div>
            </div>

            <div class="lm-scene-area">
                <div class="lm-image-container">
                    <img id="lm-scene-image" src="" alt="Escena del juego">
                    <span id="lm-image-placeholder" style="display: none;"></span>
                </div>
                <p id="lm-spanish-sentence" class="lm-sentence"></p>
            </div>

            <div class="lm-construction-area">
                <h3>Traducción al latín:</h3>
                <div id="lm-slots-container" class="lm-slots-container">
                    <!-- Dinámico -->
                </div>
            </div>

            <div class="lm-word-bank-area">
                <h3>Banco de palabras:</h3>
                <div id="lm-word-bank" class="lm-word-bank">
                    <!-- Dinámico -->
                </div>
            </div>

            <div class="lm-controls">
                <button id="lm-btn-check" onclick="onCheckAnswer()" class="lm-btn lm-btn-primary">Comprobar</button>
                <button id="lm-btn-next" onclick="onNextExercise()" class="lm-btn lm-btn-secondary" style="display: none;">Siguiente Escena</button>
            </div>
            <div id="lm-feedback" class="lm-feedback"></div>

            <!-- Modal Panel de Casos -->
            <div id="lm-case-panel-overlay" class="lm-overlay" style="display: none;">
                <div class="lm-case-panel">
                    <div class="lm-case-panel-header">
                        <h3 id="lm-lemma-title">lemma, lemmae, f.</h3>
                        <button id="lm-btn-close-panel" onclick="closeCasePanel()" class="lm-btn-close">&times;</button>
                    </div>
                    <p class="lm-case-instructions">Selecciona el caso y número correspondiente a la función de la palabra en la frase:</p>
                    <div id="lm-case-grid" class="lm-case-grid">
                        <!-- Dinámico -->
                    </div>
                    <div class="lm-case-panel-footer">
                        <button id="lm-btn-remove-word" onclick="onRemoveWordFromPanel()" class="lm-btn lm-btn-danger">Quitar palabra</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    function shuffleArray(array) {
        let newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        return newArr;
    }

    function showMenu() {
        document.getElementById('latin-mini-game').style.display = 'none';
        document.getElementById('lm-menu-screen').style.display = 'block';
    }

    function startGame() {
        const selectedDeclension = document.querySelector('input[name="declension"]:checked').value;
        const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(cb => cb.value);
        const quantityStr = document.getElementById('lm-select-quantity').value;

        if (selectedCategories.length === 0) {
            alert("Debes seleccionar al menos un foco gramatical.");
            return;
        }

        let filtered = allExercises.filter(ex => 
            selectedCategories.includes(ex.category) && 
            ex.declType === selectedDeclension
        );

        filtered = shuffleArray(filtered);
        
        if (quantityStr !== 'all') {
            const qty = parseInt(quantityStr, 10);
            filtered = filtered.slice(0, qty);
        }
        
        if (filtered.length === 0) {
            alert("No hay ejercicios disponibles para esta combinación de filtros.");
            return; 
        }
        
        gameState.filteredExercises = filtered;
        gameState.currentExerciseIndex = 0;
        
        document.getElementById('lm-menu-screen').style.display = 'none';
        document.getElementById('latin-mini-game').style.display = 'block';
        
        loadExercise(0);
    }

    function loadExercise(index) {
        const exercise = gameState.filteredExercises[index];
        gameState.currentExerciseIndex = index;
        gameState.availableWords = shuffleArray(exercise.wordBank);
        gameState.slotAssignments = new Array(exercise.targetSlots.length).fill(null);
        gameState.selectedCases = {};
        gameState.activePanelSlotIndex = null;

        document.getElementById('lm-progress').innerText = `Ejercicio ${index + 1} / ${gameState.filteredExercises.length}`;
        
        const imgEl = document.getElementById('lm-scene-image');
        const placeholderEl = document.getElementById('lm-image-placeholder');
        
        imgEl.style.display = 'block';
        placeholderEl.style.display = 'none';
        imgEl.src = exercise.image;
        
        imgEl.onerror = () => { 
            imgEl.style.display = 'none'; 
            placeholderEl.style.display = 'block';
            placeholderEl.innerText = `[Imagen de la escena: ${exercise.image}]`; 
        };
        
        document.getElementById('lm-spanish-sentence').innerText = exercise.spanishSentence;
        
        hideFeedback();
        document.getElementById('lm-btn-check').style.display = 'block';
        document.getElementById('lm-btn-next').style.display = 'none';

        renderSlots();
        renderWordBank();
    }

    function renderSlots() {
        const container = document.getElementById('lm-slots-container');
        container.innerHTML = '';
        gameState.slotAssignments.forEach((word, index) => {
            const slotEl = document.createElement('div');
            slotEl.className = 'lm-slot' + (word ? ' filled' : '');
            
            if (word) {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'lm-slot-word';
                wordSpan.innerText = word;
                slotEl.appendChild(wordSpan);

                if (gameState.selectedCases[index]) {
                    const caseSpan = document.createElement('span');
                    caseSpan.className = 'lm-slot-case';
                    caseSpan.innerText = caseLabels[gameState.selectedCases[index]] || gameState.selectedCases[index];
                    slotEl.appendChild(caseSpan);
                }
                slotEl.addEventListener('click', () => onFilledSlotClick(index, word));
            }
            container.appendChild(slotEl);
        });
    }

    function renderWordBank() {
        const container = document.getElementById('lm-word-bank');
        container.innerHTML = '';
        gameState.availableWords.forEach((word, index) => {
            const wordEl = document.createElement('div');
            wordEl.className = 'lm-word';
            wordEl.innerText = word;
            wordEl.addEventListener('click', () => onWordBankClick(index));
            container.appendChild(wordEl);
        });
    }

    function renderFeedback(isCorrect, message) {
        const feedbackEl = document.getElementById('lm-feedback');
        feedbackEl.className = `lm-feedback show ${isCorrect ? 'correct' : 'incorrect'}`;
        feedbackEl.innerText = message;
    }

    function hideFeedback() {
        document.getElementById('lm-feedback').className = 'lm-feedback';
    }

    function getLemmaByForm(form) {
        for (const [lemma, data] of Object.entries(paradigms)) {
            if (lemma === form || Object.values(data.forms).includes(form)) {
                return { lemma, data };
            }
        }
        return null;
    }

    function onWordBankClick(wordIndex) {
        const word = gameState.availableWords[wordIndex];
        const targetSlots = gameState.filteredExercises[gameState.currentExerciseIndex].targetSlots;

        let targetIndex = targetSlots.findIndex((slot, idx) => {
            const matchesLemma = slot.lemma === word;
            const matchesCorrect = slot.correct === word;
            return (matchesLemma || matchesCorrect) && gameState.slotAssignments[idx] === null;
        });

        if (targetIndex === -1) {
            targetIndex = gameState.slotAssignments.findIndex(slot => slot === null);
        }

        if (targetIndex !== -1) {
            gameState.slotAssignments[targetIndex] = word;
            gameState.availableWords.splice(wordIndex, 1);
            renderSlots();
            renderWordBank();
            hideFeedback();
        }
    }

    function onFilledSlotClick(slotIndex, word) {
        const lemmaInfo = getLemmaByForm(word);
        if (lemmaInfo) {
            openCasePanel(slotIndex, word, lemmaInfo);
        } else {
            removeWordFromSlot(slotIndex);
        }
    }

    function removeWordFromSlot(slotIndex) {
        const wordInSlot = gameState.slotAssignments[slotIndex];
        if (wordInSlot) {
            let wordToReturn = wordInSlot;
            const lemmaInfo = getLemmaByForm(wordInSlot);
            if (lemmaInfo) {
                wordToReturn = lemmaInfo.lemma;
            }

            gameState.slotAssignments[slotIndex] = null;
            delete gameState.selectedCases[slotIndex];
            gameState.availableWords.push(wordToReturn);
            renderSlots();
            renderWordBank();
            hideFeedback();
        }
    }

    function openCasePanel(slotIndex, word, lemmaInfo) {
        gameState.activePanelSlotIndex = slotIndex;
        const panel = document.getElementById('lm-case-panel-overlay');
        const title = document.getElementById('lm-lemma-title');
        const grid = document.getElementById('lm-case-grid');
        
        title.innerText = `${lemmaInfo.lemma}, ${lemmaInfo.data.forms.gen_sg}, ${lemmaInfo.data.gender}.`;
        grid.innerHTML = '';
        
        grid.innerHTML += `
            <div class="lm-case-grid-header"></div>
            <div class="lm-case-grid-header">Singular</div>
            <div class="lm-case-grid-header">Plural</div>
        `;

        const selectedCase = gameState.selectedCases[slotIndex];

        caseOrder.forEach(caseName => {
            const rowLabel = document.createElement('div');
            rowLabel.className = 'lm-case-row-label';
            rowLabel.innerText = caseName;
            grid.appendChild(rowLabel);

            const sgKey = `${caseName}_sg`;
            const sgBtn = document.createElement('button');
            sgBtn.className = `lm-case-btn ${selectedCase === sgKey ? 'selected' : ''}`;
            sgBtn.innerText = lemmaInfo.data.forms[sgKey];
            sgBtn.addEventListener('click', () => onCaseSelect(sgKey));
            grid.appendChild(sgBtn);

            const plKey = `${caseName}_pl`;
            const plBtn = document.createElement('button');
            plBtn.className = `lm-case-btn ${selectedCase === plKey ? 'selected' : ''}`;
            plBtn.innerText = lemmaInfo.data.forms[plKey];
            plBtn.addEventListener('click', () => onCaseSelect(plKey));
            grid.appendChild(plBtn);
        });

        panel.style.display = 'flex';
    }

    function closeCasePanel() {
        document.getElementById('lm-case-panel-overlay').style.display = 'none';
        gameState.activePanelSlotIndex = null;
    }

    function onCaseSelect(caseKey) {
        if (gameState.activePanelSlotIndex !== null) {
            gameState.selectedCases[gameState.activePanelSlotIndex] = caseKey;
            const slotIndex = gameState.activePanelSlotIndex;
            const originalWord = gameState.slotAssignments[slotIndex];
            const lemmaInfo = getLemmaByForm(originalWord);
            if (lemmaInfo) {
                gameState.slotAssignments[slotIndex] = lemmaInfo.data.forms[caseKey];
            }
            
            renderSlots();
            closeCasePanel();
            hideFeedback();
        }
    }

    function onRemoveWordFromPanel() {
        if (gameState.activePanelSlotIndex !== null) {
            removeWordFromSlot(gameState.activePanelSlotIndex);
            closeCasePanel();
        }
    }

    function onCheckAnswer() {
        const exercise = gameState.filteredExercises[gameState.currentExerciseIndex];
        
        let isCorrect = true;
        let errorMessage = "";

        const isComplete = gameState.slotAssignments.every(word => word !== null);
        if (!isComplete) {
            renderFeedback(false, "Debes llenar todos los espacios antes de comprobar.");
            return;
        }

        for (let i = 0; i < exercise.targetSlots.length; i++) {
            const target = exercise.targetSlots[i];
            const assignedWord = gameState.slotAssignments[i];

            if (target.lemma) {
                const lemmaInfo = getLemmaByForm(assignedWord);
                if (!lemmaInfo || lemmaInfo.lemma !== target.lemma) {
                    isCorrect = false;
                    errorMessage = `La palabra elegida no corresponde a la frase.`;
                    break;
                }
                
                const selectedCase = gameState.selectedCases[i];
                if (!selectedCase) {
                    isCorrect = false;
                    errorMessage = `Falta seleccionar el caso para '${assignedWord}'.`;
                    break;
                }
                
                if (selectedCase !== target.targetCase) {
                    isCorrect = false;
                    errorMessage = `El caso seleccionado para '${lemmaInfo.lemma}' no es correcto.`;
                    break;
                }
            } else {
                if (assignedWord !== target.correct) {
                    isCorrect = false;
                    errorMessage = "Hay palabras en el orden incorrecto o no corresponden a la frase.";
                    break;
                }
            }
        }

        renderFeedback(isCorrect, isCorrect ? "¡Correcto!" : errorMessage);

        if (isCorrect) {
            document.getElementById('lm-btn-check').style.display = 'none';

            if (gameState.currentExerciseIndex < gameState.filteredExercises.length - 1) {
                document.getElementById('lm-btn-next').style.display = 'block';
            } else {
                renderFeedback(true, "¡Excelente! Completaste la sesión de práctica.");
            }
        }
    }

    function onNextExercise() {
        if (gameState.currentExerciseIndex < gameState.filteredExercises.length - 1) {
            loadExercise(gameState.currentExerciseIndex + 1);
        }
    }

    // Sincroniza el resaltado visual de los grupos tipo toggle/switch con el input real
    // (delegación de eventos: al cambiar cualquier input del grupo, se re-evalúan todas
    // sus opciones, así la que se desmarca -radio- pierde el resaltado correctamente).
    function initToggleGroup(container) {
        const sync = () => {
            container.querySelectorAll('.lm-toggle-option').forEach(label => {
                const input = label.querySelector('input');
                label.classList.toggle('active', input.checked);
            });
        };
        container.addEventListener('change', sync);
        sync();
    }
    document.querySelectorAll('.lm-toggle-group').forEach(initToggleGroup);
    </script>
</body>
</html>
